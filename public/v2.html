<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Onco360">
<link rel="apple-touch-icon" href="onco360-icone.png">
<link rel="icon" type="image/png" href="onco360-icone.png">
<title>Onco360</title>
<style>
:root{
  /* 4.3 (12/10/2026) : 8 tailles de texte (avant : 24) */
  --t1:11px; --t2:12px; --t3:13px; --t4:14px; --t5:15px; --t6:16px; --t7:19px; --t8:26px;
  --fond:#F1F5FB; --carte:#FFFFFF; --encre:#1E2A44; --titre:#24365F; --doux:#64708A; --trait:#E2E7F0;
  --prim:#3563B0; --prim-f:#284E8F; --prim-c:#EAF0FA; --prim-cc:#D6E2F5;
  --vert:#1F8A4C; --vert-c:#DFF3E6; --bleu:#2A5DA8; --bleu-c:#E3ECF9;
  --violet:#5650C2; --violet-c:#ECEBFB; --orange:#B86E00; --orange-c:#FDEFD6; --vert-t:#17693A; --orange-t:#8F5600; /* R-C6 : textes sur fond clair (agenda), contraste ≥ 4,5:1 */
  --rouge:#B3263E; --rouge-c:#F9E1E5; --gris-c:#EEF0F4;
  --r-l:18px; --r-m:12px; --r-s:9px;
  --ombre:0 1px 2px rgba(30,42,68,.06),0 8px 24px rgba(30,42,68,.08);
  --ombre-h:0 2px 4px rgba(30,42,68,.07),0 14px 32px rgba(30,42,68,.13); --ombre-prim:0 6px 16px rgba(53,99,176,.30);
  --menu:252px;
  /* 4.3 (12/10/2026) : couleurs qui revenaient écrites en dur */
  --bord-champ:#CCD3E0; --fond-doux:#F7F9FD; --vert-f:#2E7D5B; --vert-b:#BFE3CC; --orange-v:#E07A2F; --nuit:#2B2D5C; --or:#C9A227; --gris-m:#B9C0CE; --gris-cc:#F2F4F8; --whatsapp:#25D366;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:Arial,Helvetica,sans-serif;background:var(--fond);color:var(--encre);font-size:var(--t5);line-height:1.45}
button,input,select{font:inherit}
button{cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:3px solid #9DB6E8;outline-offset:2px}
.cache{display:none!important}
.pi.plein{fill:currentColor}.pi.or{color:var(--or)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:1px;flex:none}.dot.v{background:var(--vert)}.dot.o{background:var(--orange-v)}.dot.j{background:#D6B42A}
.pi{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:-2px;margin-right:4px;flex:none}
.i{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* ── Menu (blanc, icônes au trait) ── */
#menu{position:fixed;top:0;left:0;bottom:0;width:var(--menu);background:#fff;border-right:1px solid var(--trait);display:flex;flex-direction:column;padding:20px 12px calc(14px + env(safe-area-inset-bottom));z-index:40;transition:transform .25s ease,width .2s ease,padding .2s ease;overflow-y:auto;overflow-x:hidden}
.marque{display:flex;align-items:center;gap:10px;padding:0 8px 24px}
.marque .logo{width:44px;height:44px;flex:none}
.marque b{font-size:25px;font-weight:bold;color:#1B2F6E;letter-spacing:-.5px}.marque b span{color:#1F9AA8}
nav a{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:var(--r-m);color:var(--encre);text-decoration:none;font-weight:bold;margin-bottom:2px}
nav a .i{color:var(--doux)}
nav a:hover{background:var(--prim-c)}
nav a.actif{background:var(--prim);color:#fff}
nav a.actif .i{color:#fff}
.pied{margin-top:auto;border-top:1px solid var(--trait);padding-top:14px}
.qui{display:flex;align-items:center;gap:10px;padding:0 6px 12px}
.av{width:40px;height:40px;border-radius:50%;background:var(--prim-c);color:var(--prim);display:grid;place-items:center;font-weight:bold;font-size:14px;flex:none}
.qui b{display:block;font-size:var(--t4);color:var(--titre)}.qui span{font-size:var(--t3);color:var(--doux)}
.cab-pt{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--orange-v);margin-left:4px;vertical-align:middle}.cab-choix{padding:0 6px 12px}.cab-choix label{display:block;font-size:var(--t2);color:var(--doux);margin:0 0 4px 2px}.cab-choix select{width:100%;font-weight:bold;color:var(--titre);border:1px solid var(--trait);border-radius:var(--r-m);padding:8px 10px;background:#fff}
.sortie{width:100%;display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--trait);background:#fff;border-radius:var(--r-m);color:var(--encre);font-weight:bold}
.voile{position:fixed;inset:0;background:rgba(30,42,68,.35);z-index:35}
/* ── Menu repliable (20.2, 11/10/2026) : colonne d'icônes, choix gardé sur l'appareil ── */
.replier{margin-left:auto;width:32px;height:32px;flex:none;border:1px solid var(--trait);background:#fff;border-radius:var(--r-s);display:grid;place-items:center;color:var(--doux);padding:0}
.replier:hover{background:var(--prim-c);color:var(--prim)}.replier .i{width:18px;height:18px;transition:transform .2s ease}
@media (max-width:1023px){.replier{display:none}}
@media (min-width:1024px){
  body.menu-replie{--menu:76px}
  body.menu-replie #menu{padding-left:10px;padding-right:10px}
  body.menu-replie .marque{flex-direction:column;padding:0 0 18px;gap:12px}
  body.menu-replie .marque b,body.menu-replie .cab-choix,body.menu-replie .qui>div:not(.av){display:none}
  body.menu-replie .replier{margin-left:0}body.menu-replie .replier .i{transform:rotate(180deg)}
  body.menu-replie nav a{font-size:0;gap:0;justify-content:center;padding:11px 0;position:relative}
  body.menu-replie nav a .nb-menu{position:absolute;top:2px;right:2px;min-width:17px;height:17px;padding:0 4px;font-size:var(--t1)}
  body.menu-replie .qui{justify-content:center;padding:0 0 12px}
  body.menu-replie .sortie{font-size:0;gap:0;justify-content:center;padding:10px 0}
}
/* ── Onglets sur une ligne qui défile vers la droite (Paramètres, Profil) ── */
.ag-vues.defile{flex-wrap:nowrap;overflow-x:auto;max-width:100%;scrollbar-width:thin;scroll-behavior:smooth;overscroll-behavior-x:contain}
.ag-vues.defile button{flex:none;white-space:nowrap}
.defile-cadre{position:relative;display:flex;max-width:100%;min-width:0}
.df-fl{position:absolute;top:50%;width:30px;height:30px;margin-top:-15px;border-radius:50%;border:1px solid var(--trait);background:#fff;color:var(--prim);display:none;place-items:center;padding:0;box-shadow:0 2px 8px rgba(30,42,68,.15);z-index:2}
.df-fl:hover{background:var(--prim-c)}.df-fl .i{width:16px;height:16px;margin:0}.df-fl.g{left:-6px}.df-fl.d{right:-6px}.df-fl.d .i{transform:rotate(180deg)}
.defile-cadre.g .df-fl.g,.defile-cadre.d .df-fl.d{display:grid}
.ag-vues.defile.g{-webkit-mask-image:linear-gradient(to right,transparent,#000 36px);mask-image:linear-gradient(to right,transparent,#000 36px)}
.ag-vues.defile.d{-webkit-mask-image:linear-gradient(to left,transparent,#000 36px);mask-image:linear-gradient(to left,transparent,#000 36px)}
.ag-vues.defile.g.d{-webkit-mask-image:linear-gradient(to right,transparent,#000 36px,#000 calc(100% - 36px),transparent);mask-image:linear-gradient(to right,transparent,#000 36px,#000 calc(100% - 36px),transparent)}

/* ── En-tête ── */
#tete{position:sticky;top:0;z-index:30;min-height:64px;padding:0 28px;padding-top:env(safe-area-inset-top);display:flex;align-items:center;gap:12px;background:#fff;border-bottom:1px solid var(--trait)}
/* 4.3 (12/10/2026) : recherche de patient en pilule dans la barre du haut (ordinateur et tablette ; téléphone : page Patients) */
.tr-pil{position:relative;display:flex;align-items:center;gap:8px;background:var(--gris-cc);border:1px solid var(--trait);border-radius:999px;padding:0 14px;height:40px;width:min(320px,32vw);color:var(--doux)}
.tr-pil:focus-within{background:#fff;border-color:var(--prim-cc);box-shadow:0 0 0 3px var(--prim-c)}
.tr-pil input{border:0;background:none;outline:none;flex:1;min-width:0;font:inherit;font-size:var(--t4);color:var(--encre)}
.tr-res{position:absolute;top:calc(100% + 6px);left:0;right:0;background:#fff;border:1px solid var(--trait);border-radius:var(--r-m);box-shadow:var(--ombre-h);padding:6px;z-index:40;max-height:60vh;overflow:auto}
.tr-res button{display:flex;flex-direction:column;align-items:flex-start;width:100%;text-align:left;border:0;background:none;border-radius:8px;padding:8px 10px;cursor:pointer;font:inherit;color:var(--encre)}
.tr-res button:hover,.tr-res button.on{background:var(--prim-c)}.tr-res small{color:var(--doux);font-size:var(--t2)}.tr-res p{margin:6px 10px;color:var(--doux);font-size:var(--t3)}
@media (max-width:767px){.tr-pil{display:none}}
body.role-comptable .tr-pil{display:none}
/* R-B3 (19/10/2026) : téléphone : loupe ronde à gauche de la cloche ; au toucher, la recherche s'ouvre sur toute la largeur sous la barre */
#tete .tr-loupe,#tete .tr-x{display:none}
@media (max-width:767px){
  #tete .tr-loupe{display:grid;width:44px;height:44px}#tete #cloche{width:44px;height:44px}
  #tete.rech-ouv .tr-pil{display:flex;position:absolute;left:12px;right:12px;top:calc(100% + 6px);width:auto;height:48px;background:#fff;border-color:var(--prim-cc);box-shadow:var(--ombre-h);z-index:41}
  #tete.rech-ouv .tr-x{display:grid;place-items:center;width:44px;height:44px;margin-right:-10px;border:0;background:none;color:var(--doux);cursor:pointer}
  #tete.rech-ouv .tr-loupe{background:var(--prim-c);border-color:var(--prim-cc);color:var(--prim)}
}
body.role-comptable .tr-loupe{display:none!important}
#tete h1{font-size:var(--t7);margin:0;flex:1;color:var(--titre)}
.rond{width:42px;height:42px;border-radius:50%;border:1px solid var(--trait);background:#fff;display:grid;place-items:center;position:relative;color:var(--encre)}
.pastille{position:absolute;top:-4px;right:-4px;min-width:20px;height:20px;padding:0 5px;border-radius:10px;background:var(--orange-v);color:#fff;font-size:var(--t1);font-weight:bold;display:grid;place-items:center}
#tete .av{background:var(--prim);color:#fff}
#burger{display:none}
#panneauAlertes{position:absolute;top:58px;right:28px;width:min(440px,calc(100vw - 24px));max-height:70vh;overflow:auto;background:#fff;border:1px solid var(--trait);border-radius:var(--r-l);box-shadow:0 18px 40px rgba(30,42,68,.16);padding:8px;z-index:50}
#panneauAlertes h3{font-size:var(--t5);margin:8px 10px;color:var(--titre)}
.al{display:flex;gap:10px;align-items:flex-start;padding:9px 10px;border-radius:var(--r-s);cursor:pointer;font-size:var(--t4)}
.al:hover{background:var(--fond)}
.pt{width:9px;height:9px;border-radius:50%;margin-top:5px;flex:none}

/* ── Contenu : une seule colonne ── */
#zone{margin-left:var(--menu);min-height:100vh;transition:margin-left .2s ease}
#page{max-width:none;margin:0;padding:26px 36px 60px;display:flex;flex-direction:column;gap:18px}
.accueil{display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap}
.accueil h2{font-size:var(--t8);margin:0;color:var(--titre)}
.accueil p{margin:3px 0 0;color:var(--doux)}
.accueil .actions{margin-left:auto;display:flex;gap:10px;flex-wrap:wrap}
.bt{display:inline-flex;align-items:center;gap:7px;border:0;border-radius:var(--r-m);padding:11px 16px;font-weight:bold;font-size:var(--t4)}
.bt .i{width:18px;height:18px;stroke-width:2.2}
.bt.plein{background:var(--prim);color:#fff}.bt.plein:hover{background:var(--prim-f)}
.bt.clair{background:var(--prim-c);color:var(--prim)}
.bt.petit{padding:7px 12px;font-size:var(--t3);border-radius:var(--r-s)}
.bt.rouge{background:var(--rouge);color:#fff}.abo-c a.bt{text-decoration:none;white-space:nowrap}
.bt .sm{display:none}
.carte{background:#fff;border-radius:var(--r-l);box-shadow:var(--ombre);border:1px solid var(--gris-c);padding:20px}
.carte h3{margin:0 0 4px;font-size:var(--t7);color:var(--titre);display:flex;align-items:center;gap:9px}
.carte h3 .ic{width:34px;height:34px;border-radius:10px;background:var(--prim-c);color:var(--prim);display:grid;place-items:center;flex:none;font-size:var(--t6)}
.carte .sous{color:var(--doux);font-size:var(--t4);margin:0 0 14px}
.retour{display:inline-flex;align-items:center;gap:6px;color:var(--prim);font-weight:bold;text-decoration:none;font-size:var(--t4)}

/* Aujourd'hui : fond bleu clair, catégories blanches */
.jour{background:var(--prim-c);border:1px solid var(--prim-cc);border-radius:var(--r-l);padding:20px 18px 8px}
.jour .ent{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.jour .ent h3{font-size:var(--t7);margin:0;color:var(--titre);display:flex;align-items:center;gap:9px}
.jour .ent h3 .ic{width:34px;height:34px;border-radius:10px;background:var(--prim);color:#fff;display:grid;place-items:center}
.jour .ent span{color:var(--doux)}
.jour .ent .tot{margin-left:auto;background:#fff;color:var(--prim);padding:5px 12px;border-radius:20px;font-weight:bold;font-size:var(--t3);border:1px solid var(--prim-cc)}
.cat{background:#fff;border:1px solid var(--prim-cc);border-radius:var(--r-m);margin-bottom:12px;overflow:hidden}
.cat .tc{display:flex;align-items:center;gap:8px;padding:11px 14px;font-weight:bold;font-size:var(--t5);color:var(--titre)}
.cat .tc .n{margin-left:auto;background:var(--prim-c);color:var(--prim);border-radius:20px;padding:1px 9px;font-size:var(--t3)}
.li{display:flex;align-items:center;gap:12px;padding:10px 14px;border-top:1px solid var(--gris-c);cursor:pointer}
.li:hover{background:var(--fond-doux)}
.li .h{font-weight:bold;min-width:50px;color:var(--prim)}
.li .tx{flex:1;min-width:0}.li .de{color:var(--doux);font-size:var(--t4)}
.vide{padding:2px 14px 12px;color:var(--doux);font-size:var(--t4)}
.badge{display:inline-block;border-radius:20px;padding:3px 10px;font-size:var(--t3);font-weight:bold;white-space:nowrap}
.b-rt{background:var(--violet-c);color:var(--violet)}.b-co{background:var(--bleu-c);color:var(--bleu)}.b-ch{background:var(--vert-c);color:var(--vert)}.b-al{background:var(--rouge-c);color:var(--rouge)}.b-or{background:var(--orange-c);color:var(--orange)}.b-gr{background:var(--gris-c);color:#55607A}
/* 3.2 et 3.3 (12/10/2026) : bandeau d'allergie (seulement si « oui »), patient décédé */
.b-dc{background:#3B3F4A;color:#fff}
/* 3.7 (12/10/2026) : menu ⋯ des cures et des lignes */
details.m3{position:relative;display:inline-block}details.m3>summary{list-style:none;cursor:pointer;min-width:34px;text-align:center;font-weight:bold}details.m3>summary::-webkit-details-marker{display:none}
.m3-l{position:absolute;right:0;top:calc(100% + 4px);z-index:30;background:#fff;border:1px solid var(--trait);border-radius:10px;box-shadow:0 6px 18px rgba(20,30,60,.14);padding:6px;display:flex;flex-direction:column;gap:4px;min-width:190px}.m3-l .mini{text-align:left;margin:0;width:100%}.id-plus{display:none}
@media(max-width:700px){.id-c:not(.id-ouv) .champs,.id-c:not(.id-ouv) .resume{display:none}.id-plus{display:inline-flex}}.al-band{display:flex;align-items:center;gap:6px;background:#FFF1F1;border:1px solid #F3C4C4;color:#A1232B;border-radius:8px;padding:6px 10px;margin:0 0 10px;font-size:var(--t4)}.al-band .pi{width:16px;height:16px;flex:none}.al-band.dc{background:var(--gris-c);border-color:var(--bord-champ);color:#3B3F4A}

/* 7 jours */
.jour7{margin-top:14px}.jour7:first-of-type{margin-top:4px}
.jour7 h4{margin:0 0 4px;font-size:var(--t4);color:var(--titre);background:var(--prim-c);border-radius:var(--r-s);padding:6px 10px}
.ev{display:flex;align-items:center;gap:10px;padding:9px 4px;border-bottom:1px solid var(--trait);cursor:pointer}
.ev:last-child{border-bottom:0}.ev:hover{background:var(--fond-doux)}
.ev .h{font-weight:bold;min-width:62px;color:var(--prim)}
.ev .h.j{color:var(--doux);font-weight:normal;font-size:var(--t3)}
.ev .tx{flex:1;min-width:0}.ev .tx span{color:var(--doux);font-size:var(--t4)}
.lien{background:none;border:0;color:var(--prim);font-weight:bold;font-size:var(--t3);white-space:nowrap}

/* Absences */
.abs{border-left:5px solid var(--rouge)}
.abs h3 .ic{background:var(--rouge-c);color:var(--rouge)}
.per{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-weight:bold;color:var(--rouge);background:var(--rouge-c);padding:8px 10px;border-radius:var(--r-s);margin:10px 0 6px}
.per span{font-weight:normal;color:#7A2333;font-size:var(--t3)}
.conf{display:flex;align-items:center;gap:10px;padding:8px 2px;border-bottom:1px solid var(--trait);font-size:var(--t4)}
.conf:last-child{border-bottom:0}.conf .tx{flex:1;min-width:0}
.ok{color:var(--vert);padding:4px 2px}

/* Statistiques */
.kpi{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.k{background:#fff;border:1px solid var(--trait);border-radius:var(--r-m);padding:14px;text-align:left;color:var(--encre);display:flex;flex-direction:column;gap:4px}
.k:hover{border-color:var(--prim-cc);background:var(--fond-doux)}
.k .ic{width:38px;height:38px;border-radius:11px;background:var(--prim-c);color:var(--prim);display:grid;place-items:center;font-size:var(--t7)}
.k b{font-size:28px;color:var(--titre);line-height:1.2;margin-top:4px}
.k span{color:var(--doux);font-size:var(--t4)}

/* Patients */
.filtres{display:flex;gap:10px;flex-wrap:wrap}
.recherche{flex:3;min-width:220px;position:relative}
.recherche .i{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--doux)}
.recherche input{width:100%;padding:12px 14px 12px 42px;border:1px solid var(--bord-champ);border-radius:var(--r-m);font-size:var(--t6);background:#fff}
.filtres select{flex:2;min-width:200px;padding:12px;border:1px solid var(--bord-champ);border-radius:var(--r-m);background:#fff;font-size:var(--t5)}
.pat{display:flex;align-items:center;gap:12px;padding:12px 4px;border-bottom:1px solid var(--trait);cursor:pointer}
.pat:last-child{border-bottom:0}.pat:hover{background:var(--fond-doux)}
.pat .tx{flex:1;min-width:0}.pat .tx b{display:block}.pat .tx span{display:block;color:var(--doux);font-size:var(--t4)}
.pat .dr{display:flex;flex-direction:column;align-items:flex-end;gap:4px}

/* Dossier */
.ident{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.ident .av{width:58px;height:58px;font-size:19px}
.ident h2{margin:0;font-size:var(--t8);color:var(--titre)}
.ident p{margin:2px 0 0;color:var(--doux)}
.ident .bd{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.champs{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px 18px;margin-top:16px;padding-top:14px;border-top:1px solid var(--trait)}
.champs label{display:block;font-size:var(--t2);color:var(--doux)}
.champs div b{font-weight:bold}
/* Abonnement du cabinet (18.5) : carte du tableau de bord, onglets Abonnement et Factures de Mon compte */
.abo-c{display:flex;gap:18px;align-items:center;border-left:5px solid var(--orange);flex-wrap:wrap}.abo-c.rouge{border-left-color:var(--rouge)}.abo-c .abo-g{flex:1;min-width:240px}
.abo-tete{display:flex;gap:10px;align-items:center;color:var(--doux);font-size:var(--t4);margin-bottom:10px}.abo-b{background:var(--orange-c);color:var(--orange);font-weight:bold;font-size:var(--t2);padding:4px 10px;border-radius:20px;letter-spacing:.3px}.abo-c.rouge .abo-b{background:var(--rouge-c);color:var(--rouge)}

// Déconnexion de secours : marche même si l'application n'a pas pu se charger (la page de connexion termine la déconnexion)
function onco360Deconnecter() {
  var b = document.getElementById("btSecours"); if (b) { b.disabled = true; b.textContent = "Déconnexion…"; }
  var fin = function () { location.replace("index.html?sortie=1"); };
  Promise.race([
    import("./js/config.js").then(function (m) { return import("https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js").then(function (a) { return a.signOut(m.auth); }); }),
    new Promise(function (ok) { setTimeout(ok, 6000); })
  ]).then(fin, fin);
}
</script>
