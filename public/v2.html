<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Onco360">
<link rel="apple-touch-icon" href="onco360-icone.png">
<link rel="icon" type="image/png" href="onco360-icone.png">
<title>Onco360</title>
<style>
:root{
  --fond:#F5F7FB; --carte:#FFFFFF; --encre:#1E2A44; --titre:#24365F; --doux:#64708A; --trait:#E2E7F0;
  --prim:#3563B0; --prim-f:#284E8F; --prim-c:#EAF0FA; --prim-cc:#D6E2F5;
  --vert:#1F8A4C; --vert-c:#DFF3E6; --bleu:#2A5DA8; --bleu-c:#E3ECF9;
  --violet:#5650C2; --violet-c:#ECEBFB; --orange:#B86E00; --orange-c:#FDEFD6;
  --rouge:#B3263E; --rouge-c:#F9E1E5; --gris-c:#EEF0F4;
  --r-l:16px; --r-m:12px; --r-s:9px;
  --ombre:0 1px 3px rgba(30,42,68,.05),0 6px 18px rgba(30,42,68,.06);
  --menu:252px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:Arial,Helvetica,sans-serif;background:var(--fond);color:var(--encre);font-size:15px;line-height:1.45}
button,input,select{font:inherit}
button{cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:3px solid #9DB6E8;outline-offset:2px}
.cache{display:none!important}
.pi.plein{fill:currentColor}.pi.or{color:#C9A227}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:1px;flex:none}.dot.v{background:#1F8A4C}.dot.o{background:#E07A2F}.dot.j{background:#D6B42A}
.pi{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:-2px;margin-right:4px;flex:none}
.i{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* ── Menu (blanc, icônes au trait) ── */
#menu{position:fixed;top:0;left:0;bottom:0;width:var(--menu);background:#fff;border-right:1px solid var(--trait);display:flex;flex-direction:column;padding:20px 12px calc(14px + env(safe-area-inset-bottom));z-index:40;transition:transform .25s ease;overflow-y:auto}
.marque{display:flex;align-items:center;gap:10px;padding:0 8px 24px}
.marque .logo{width:44px;height:44px;flex:none}
.marque b{font-size:25px;font-weight:bold;color:#1B2F6E;letter-spacing:-.5px}.marque b span{color:#1F9AA8}
nav a{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:var(--r-m);color:var(--encre);text-decoration:none;font-weight:bold;margin-bottom:2px}
nav a .i{color:var(--doux)}
nav a:hover{background:var(--prim-c)}
nav a.actif{background:var(--prim);color:#fff}
nav a.actif .i{color:#fff}
.pied{margin-top:auto;border-top:1px solid var(--trait);padding-top:14px}
.qui{display:flex;align-items:center;gap:10px;padding:0 6px 12px}
.av{width:40px;height:40px;border-radius:50%;background:var(--prim-c);color:var(--prim);display:grid;place-items:center;font-weight:bold;font-size:14px;flex:none}
.qui b{display:block;font-size:14px;color:var(--titre)}.qui span{font-size:12.5px;color:var(--doux)}
.sortie{width:100%;display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--trait);background:#fff;border-radius:var(--r-m);color:var(--encre);font-weight:bold}
.voile{position:fixed;inset:0;background:rgba(30,42,68,.35);z-index:35}

/* ── En-tête ── */
#tete{position:sticky;top:0;z-index:30;min-height:64px;padding:0 28px;padding-top:env(safe-area-inset-top);display:flex;align-items:center;gap:12px;background:#fff;border-bottom:1px solid var(--trait)}
#tete h1{font-size:19px;margin:0;flex:1;color:var(--titre)}
.rond{width:42px;height:42px;border-radius:50%;border:1px solid var(--trait);background:#fff;display:grid;place-items:center;position:relative;color:var(--encre)}
.pastille{position:absolute;top:-4px;right:-4px;min-width:20px;height:20px;padding:0 5px;border-radius:10px;background:#E07A2F;color:#fff;font-size:11px;font-weight:bold;display:grid;place-items:center}
#tete .av{background:var(--prim);color:#fff}
#burger{display:none}
#panneauAlertes{position:absolute;top:58px;right:28px;width:min(440px,calc(100vw - 24px));max-height:70vh;overflow:auto;background:#fff;border:1px solid var(--trait);border-radius:var(--r-l);box-shadow:0 18px 40px rgba(30,42,68,.16);padding:8px;z-index:50}
#panneauAlertes h3{font-size:15px;margin:8px 10px;color:var(--titre)}
.al{display:flex;gap:10px;align-items:flex-start;padding:9px 10px;border-radius:var(--r-s);cursor:pointer;font-size:14px}
.al:hover{background:var(--fond)}
.pt{width:9px;height:9px;border-radius:50%;margin-top:5px;flex:none}

/* ── Contenu : une seule colonne ── */
#zone{margin-left:var(--menu);min-height:100vh}
#page{max-width:1240px;margin:0 auto;padding:26px 32px 60px;display:flex;flex-direction:column;gap:18px}
.accueil{display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap}
.accueil h2{font-size:28px;margin:0;color:var(--titre)}
.accueil p{margin:3px 0 0;color:var(--doux)}
.accueil .actions{margin-left:auto;display:flex;gap:10px;flex-wrap:wrap}
.bt{display:inline-flex;align-items:center;gap:7px;border:0;border-radius:var(--r-m);padding:11px 16px;font-weight:bold;font-size:14.5px}
.bt .i{width:18px;height:18px;stroke-width:2.2}
.bt.plein{background:var(--prim);color:#fff}.bt.plein:hover{background:var(--prim-f)}
.bt.clair{background:var(--prim-c);color:var(--prim)}
.bt.petit{padding:7px 12px;font-size:13px;border-radius:var(--r-s)}
.bt.rouge{background:var(--rouge);color:#fff}
.bt .sm{display:none}
.carte{background:#fff;border-radius:var(--r-l);box-shadow:var(--ombre);border:1px solid #E9EDF4;padding:20px}
.carte h3{margin:0 0 4px;font-size:18px;color:var(--titre);display:flex;align-items:center;gap:9px}
.carte h3 .ic{width:34px;height:34px;border-radius:10px;background:var(--prim-c);color:var(--prim);display:grid;place-items:center;flex:none;font-size:17px}
.carte .sous{color:var(--doux);font-size:13.5px;margin:0 0 14px}
.retour{display:inline-flex;align-items:center;gap:6px;color:var(--prim);font-weight:bold;text-decoration:none;font-size:14px}

/* Aujourd'hui : fond bleu clair, catégories blanches */
.jour{background:var(--prim-c);border:1px solid var(--prim-cc);border-radius:var(--r-l);padding:20px 18px 8px}
.jour .ent{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.jour .ent h3{font-size:21px;margin:0;color:var(--titre);display:flex;align-items:center;gap:9px}
.jour .ent h3 .ic{width:34px;height:34px;border-radius:10px;background:var(--prim);color:#fff;display:grid;place-items:center}
.jour .ent span{color:var(--doux)}
.jour .ent .tot{margin-left:auto;background:#fff;color:var(--prim);padding:5px 12px;border-radius:20px;font-weight:bold;font-size:13px;border:1px solid var(--prim-cc)}
.cat{background:#fff;border:1px solid var(--prim-cc);border-radius:var(--r-m);margin-bottom:12px;overflow:hidden}
.cat .tc{display:flex;align-items:center;gap:8px;padding:11px 14px;font-weight:bold;font-size:15px;color:var(--titre)}
.cat .tc .n{margin-left:auto;background:var(--prim-c);color:var(--prim);border-radius:20px;padding:1px 9px;font-size:13px}
.li{display:flex;align-items:center;gap:12px;padding:10px 14px;border-top:1px solid #EEF1F6;cursor:pointer}
.li:hover{background:#F7F9FD}
.li .h{font-weight:bold;min-width:50px;color:var(--prim)}
.li .tx{flex:1;min-width:0}.li .de{color:var(--doux);font-size:13.5px}
.vide{padding:2px 14px 12px;color:var(--doux);font-size:14px}
.badge{display:inline-block;border-radius:20px;padding:3px 10px;font-size:12.5px;font-weight:bold;white-space:nowrap}
.b-rt{background:var(--violet-c);color:var(--violet)}.b-co{background:var(--bleu-c);color:var(--bleu)}.b-ch{background:var(--vert-c);color:var(--vert)}.b-al{background:var(--rouge-c);color:var(--rouge)}.b-or{background:var(--orange-c);color:var(--orange)}.b-gr{background:var(--gris-c);color:#55607A}

/* 7 jours */
.jour7{margin-top:14px}.jour7:first-of-type{margin-top:4px}
.jour7 h4{margin:0 0 4px;font-size:14px;color:var(--titre);background:var(--prim-c);border-radius:var(--r-s);padding:6px 10px}
.ev{display:flex;align-items:center;gap:10px;padding:9px 4px;border-bottom:1px solid var(--trait);cursor:pointer}
.ev:last-child{border-bottom:0}.ev:hover{background:#FAFBFE}
.ev .h{font-weight:bold;min-width:62px;color:var(--prim)}
.ev .h.j{color:var(--doux);font-weight:normal;font-size:13px}
.ev .tx{flex:1;min-width:0}.ev .tx span{color:var(--doux);font-size:13.5px}
.lien{background:none;border:0;color:var(--prim);font-weight:bold;font-size:13px;white-space:nowrap}

/* Absences */
.abs{border-left:5px solid var(--rouge)}
.abs h3 .ic{background:var(--rouge-c);color:var(--rouge)}
.per{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-weight:bold;color:var(--rouge);background:var(--rouge-c);padding:8px 10px;border-radius:var(--r-s);margin:10px 0 6px}
.per span{font-weight:normal;color:#7A2333;font-size:13px}
.conf{display:flex;align-items:center;gap:10px;padding:8px 2px;border-bottom:1px solid var(--trait);font-size:14px}
.conf:last-child{border-bottom:0}.conf .tx{flex:1;min-width:0}
.ok{color:var(--vert);padding:4px 2px}

/* Statistiques */
.kpi{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.k{background:#fff;border:1px solid var(--trait);border-radius:var(--r-m);padding:14px;text-align:left;color:var(--encre);display:flex;flex-direction:column;gap:4px}
.k:hover{border-color:var(--prim-cc);background:#FAFCFF}
.k .ic{width:38px;height:38px;border-radius:11px;background:var(--prim-c);color:var(--prim);display:grid;place-items:center;font-size:18px}
.k b{font-size:28px;color:var(--titre);line-height:1.2;margin-top:4px}
.k span{color:var(--doux);font-size:13.5px}

/* Patients */
.filtres{display:flex;gap:10px;flex-wrap:wrap}
.recherche{flex:3;min-width:220px;position:relative}
.recherche .i{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--doux)}
.recherche input{width:100%;padding:12px 14px 12px 42px;border:1px solid #CCD3E0;border-radius:var(--r-m);font-size:16px;background:#fff}
.filtres select{flex:2;min-width:200px;padding:12px;border:1px solid #CCD3E0;border-radius:var(--r-m);background:#fff;font-size:15px}
.pat{display:flex;align-items:center;gap:12px;padding:12px 4px;border-bottom:1px solid var(--trait);cursor:pointer}
.pat:last-child{border-bottom:0}.pat:hover{background:#FAFBFE}
.pat .tx{flex:1;min-width:0}.pat .tx b{display:block}.pat .tx span{display:block;color:var(--doux);font-size:13.5px}
.pat .dr{display:flex;flex-direction:column;align-items:flex-end;gap:4px}

/* Dossier */
.ident{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.ident .av{width:58px;height:58px;font-size:19px}
.ident h2{margin:0;font-size:24px;color:var(--titre)}
.ident p{margin:2px 0 0;color:var(--doux)}
.ident .bd{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.champs{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px 18px;margin-top:16px;padding-top:14px;border-top:1px solid var(--trait)}
.champs label{display:block;font-size:12px;color:var(--doux)}
.champs div b{font-weight:bold}
.ligne{border:1px solid var(--trait);border-radius:var(--r-m);padding:14px;margin-top:12px}
.ligne .tl{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.ligne .tl b{font-size:16px;color:var(--titre)}
.ligne .st{color:var(--doux);font-size:13.5px;margin:3px 0 0}
.cure{border-top:1px solid var(--trait);padding:10px 0 4px;margin-top:10px}
.cure .tc{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.cure .tc b{min-width:34px;color:var(--titre)}
.mesures{color:var(--doux);font-size:13px;margin-top:3px}
.seances{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
details summary{cursor:pointer;color:var(--prim);font-weight:bold;font-size:13.5px;margin-top:6px}
.doses{width:100%;border-collapse:collapse;margin-top:6px;font-size:14px}
.doses th{text-align:left;font-size:12px;color:var(--doux);font-weight:bold;padding:5px 6px;border-bottom:1px solid var(--trait)}
.doses td{padding:6px;border-bottom:1px solid #F0F2F7;vertical-align:top}
.doses td.d{font-weight:bold;white-space:nowrap;color:var(--titre)}
.tableau{overflow-x:auto}
.rt{border:1px solid var(--trait);border-radius:var(--r-m);padding:14px;margin-top:12px}
.etapes{margin-top:8px}
.etape{display:flex;align-items:center;gap:9px;padding:3px 0;font-size:14.5px;color:var(--doux)}
.etape.fait{color:var(--encre)}
.etape .ck{width:20px;height:20px;border-radius:50%;border:2px solid #CBD3E1;display:grid;place-items:center;flex:none}
.etape.fait .ck{background:#2E7D5B;border-color:#2E7D5B;color:#fff}
.etape .ck .i{width:12px;height:12px;stroke-width:3.2}
.barre{height:9px;background:var(--gris-c);border-radius:6px;overflow:hidden;margin:6px 0 2px}
.barre i{display:block;height:100%;background:var(--violet);border-radius:6px}
.rdv{display:flex;align-items:center;gap:10px;padding:9px 2px;border-bottom:1px solid var(--trait);font-size:14px}
.rdv:last-child{border-bottom:0}.rdv .tx{flex:1;min-width:0}
.notes{width:100%;min-height:110px;margin-top:10px;padding:12px;border:1px solid #CCD3E0;border-radius:var(--r-s);font:inherit;font-size:15px;line-height:1.5;color:var(--encre);background:#fff;resize:vertical}
.notes.lecture{white-space:pre-wrap;min-height:0}
/* Dossier : un seul cadre à onglets (Consultation, Chimiothérapie, Radiothérapie, Documents) */
.onglets{padding-top:4px}
.o-barre{display:flex;gap:2px;border-bottom:1px solid var(--trait);margin:0 -20px 16px;padding:0 12px;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}.o-barre::-webkit-scrollbar{display:none}
.o-barre button{flex:none;display:inline-flex;align-items:center;gap:7px;border:0;border-bottom:3px solid transparent;margin-bottom:-1px;background:none;padding:13px 14px 11px;font-weight:bold;font-size:15px;color:var(--doux);white-space:nowrap}
.o-barre .pi{width:18px;height:18px;margin:0}.o-barre button:hover{color:var(--titre)}.o-barre button.on{color:var(--prim);border-bottom-color:var(--prim)}
.o-barre .n{background:var(--gris-c);color:#55607A;border-radius:20px;padding:1px 8px;font-size:12px}.o-barre button.on .n{background:var(--prim-c);color:var(--prim)}
/* La chimiothérapie garde sa présentation, sans carte dans la carte ; son titre est celui de l'onglet */
.o-pan>.carte{box-shadow:none;border:0;border-radius:0;padding:0}.o-pan>.carte>.entete>h3{display:none}.o-pan .entete{justify-content:flex-end}
.o-pan>.rt:first-child,.o-pan>.entete+.rt{margin-top:4px}
/* Journal des consultations : consultations pliables (date + titre), lignes Note / Médic. / Analyses…, barre des prescriptions */
.rdv-liste.defile{overflow-y:auto;overscroll-behavior:contain;padding-right:4px;border-bottom:1px solid var(--trait)}.rdv-liste{position:relative}
.ico.etoile .pi{color:#B9C0CE}.ico.etoile.on .pi{color:#C9A227;fill:#E8C547}
.cs-liste{max-height:545px;overflow-y:auto;overscroll-behavior:contain;padding-right:4px;margin-top:4px}@media (max-width:640px){.cs-liste{max-height:68vh}}
.cs{border:1px solid var(--trait);border-radius:var(--r-m);margin-top:10px;overflow:hidden}.cs.on{border-color:var(--prim-cc)}
.cs-t{display:flex;align-items:center;gap:10px;width:100%;border:0;background:#F7F9FD;padding:10px 12px;text-align:left;font-size:14.5px;color:var(--encre)}
.cs-t:hover{background:#EEF3FB}.cs.on .cs-t{background:var(--prim-c)}
.cs-t .fl{color:var(--doux);width:12px;flex:none}.cs-t .dt{font-weight:bold;color:var(--titre);white-space:nowrap}.cs-t .ti{flex:1;min-width:0;font-weight:bold}.cs-t .au{color:var(--doux);font-size:12.5px;white-space:nowrap}
.cs-c{padding:6px 12px 12px}
.cs-l{width:100%;border-collapse:collapse;font-size:14.5px}
.cs-l th{width:120px;text-align:left;vertical-align:top;color:var(--doux);font-size:12.5px;padding:9px 10px 9px 0;border-bottom:1px solid #EEF1F6}
.cs-l td{padding:8px 0;vertical-align:top;border-bottom:1px solid #EEF1F6;white-space:pre-wrap}
.cs-l td.au{width:180px;color:var(--doux);font-size:12.5px;white-space:normal;padding-left:10px;text-align:right}
.presc{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.presc-bas{margin-top:18px;padding-top:14px;border-top:1px solid var(--trait)}.presc-bas .lbl{font-size:12.5px;font-weight:bold;color:var(--doux)}.presc-bas .presc{margin-top:8px}
.pr{display:inline-flex;border:1px solid var(--trait);border-radius:10px;overflow:hidden;background:#fff}
.pr button{border:0;background:none;padding:8px 10px;font-weight:bold;font-size:13px;color:var(--titre);display:inline-flex;align-items:center;gap:6px}
.pr button:hover{background:var(--prim-c)}.pr .fl{border-left:1px solid var(--trait);padding:8px 8px;color:var(--doux)}.pr .pi{width:17px;height:17px;margin:0;color:var(--prim)}
.cs-note{font-size:15px;line-height:1.5}
.mini.doc-ok{color:var(--vert);border-color:#BFE3CC;background:#F3FAF6}.mini.doc-ok .pi{width:13px;height:13px;margin-right:3px}
.lien-l{border:0;background:none;padding:0;text-align:left;font:inherit;color:var(--prim);text-decoration:underline;text-underline-offset:2px;cursor:pointer}
/* Médicaments et ordonnance */
.md-barre{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:8px}.md-barre .recherche{flex:1;min-width:200px}.md-barre .recherche input{padding:10px 12px 10px 40px;font-size:15px}
.md-liste{max-height:42vh;overflow:auto;border:1px solid var(--trait);border-radius:var(--r-m)}
.md-t{width:100%;border-collapse:collapse;font-size:14px}
.md-t th{position:sticky;top:0;z-index:1;background:#F2F4F8;text-align:left;font-size:12.5px;color:var(--doux);padding:7px 10px}
.md-t td{padding:7px 10px;border-top:1px solid #EEF1F6;vertical-align:top}.md-t td:first-child{width:38%}
.md-t tr.m{cursor:pointer;user-select:none}.md-t tr.m:hover td{background:#F4F7FD}.md-t td.act{white-space:nowrap;text-align:right;width:118px}.md-t .cl{color:var(--doux);font-size:12px;margin-top:2px}
.ico{border:1px solid var(--trait);background:#fff;border-radius:8px;min-width:32px;height:32px;padding:0 6px;display:inline-grid;place-items:center;color:var(--titre);font-weight:bold;font-size:13px;margin-left:4px}
.ico .pi{margin:0;width:16px;height:16px}.ico:hover{background:var(--prim-c)}.ico:disabled{opacity:.35;cursor:default}.ico.vert{color:var(--vert);border-color:#BFE3CC}.ico.rouge{color:var(--rouge);border-color:#EDC3CB}
.md-ordo{border:1px solid var(--trait);border-radius:var(--r-m);padding:4px 12px;max-height:26vh;overflow:auto}
.md-ordo .it.ed .tx{display:flex;flex-direction:column;gap:6px}.md-ordo .it.ed input,.md-ordo .it.ed textarea{width:100%;padding:7px 9px;border:1px solid #CCD3E0;border-radius:8px;font:inherit;font-size:14px}.md-ordo .it.ed input{font-weight:bold}
.md-ajout{display:flex;gap:8px;align-items:flex-start;flex-wrap:wrap;margin-top:8px}.md-ajout .recherche{flex:1;min-width:220px;position:relative}.md-ajout .recherche input{padding:9px 12px 9px 40px;font-size:15px}
.md-ajout .sug{top:100%;margin-top:2px}.md-ajout .sug div{font-size:13.5px}

.cure-ent{display:flex;gap:12px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap;margin-bottom:12px}
.jours-cure{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px}
.jc{border:1px solid #D7DCE6;border-radius:12px;padding:12px 14px;background:#fff;display:flex;flex-direction:column;gap:5px;font-size:14px;cursor:pointer;transition:border-color .15s,box-shadow .15s}
.jc:hover,.jc:focus{border-color:var(--prim);box-shadow:0 2px 10px rgba(53,99,176,.12);outline:none}.jc>b{font-size:20px;color:var(--titre)}
.jc.ok{background:#EEF8F1;border-color:#BFE3CC}.jc.ann{background:#FBEFF0;border-color:#F0C9CD}.jc.off{cursor:default;opacity:.65}.jc.off:hover{box-shadow:none;border-color:#D7DCE6}
.jc input{padding:7px 8px;border:1px solid #CCD3E0;border-radius:8px;font-size:15px;max-width:100%}.jc .ouv{margin-top:auto;color:var(--prim);font-weight:bold;font-size:13px}
.bloc.cons{display:flex;gap:18px;align-items:center;flex-wrap:wrap;margin-top:14px;background:#fff}.cons-ch{display:inline-flex;align-items:center;gap:6px}.cons-ch select,.cons-ch input[type=date]{padding:6px 8px;border:1px solid #CCD3E0;border-radius:8px;font:inherit;background:#fff}
/* Séances d'une cure (J1, J8…) : tableau sur ordinateur, cartes sur téléphone */
.tsea td{vertical-align:middle}.tsea input[type=date]{max-width:160px}
@media (max-width:640px){.tsea,.tsea tbody,.tsea tr,.tsea td{display:block;width:100%}.tsea tr:first-child{display:none}
  .tsea tr{border:1px solid var(--trait);border-radius:var(--r-m);margin-bottom:10px;padding:6px 4px;background:#fff}
  .tsea td{border:0;padding:5px 8px;display:flex;justify-content:space-between;align-items:center;gap:10px;text-align:right}
  .tsea td::before{content:attr(data-l);font-size:12px;font-weight:bold;color:var(--doux);text-align:left}.tsea td.act{display:block}.tsea td.act::before{content:none}
  .tsea td.act .btns{justify-content:flex-start}.tsea td .mesures{text-align:right}}.chk{display:flex;gap:8px;align-items:center;font-weight:bold;margin:0}.chk input{width:auto}
.valj{margin-top:14px;padding-top:12px;border-top:1px solid var(--trait)}
.actnom{display:flex;gap:6px;align-items:center}.actnom input{flex:1;min-width:170px;padding:7px 8px;border:1px solid #CCD3E0;border-radius:8px;font-weight:bold;font-size:14px}
.plages{display:flex;flex-wrap:wrap;gap:8px;align-items:center}.plage{display:inline-flex;gap:6px;align-items:center;background:var(--prim-c);border-radius:10px;padding:4px 6px}
.barre-enr{position:sticky;bottom:12px;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:#fff;border:1px solid var(--trait);border-radius:var(--r-l);padding:10px 14px;box-shadow:var(--ombre)}
.cfh td:first-child{width:140px}.plage input{padding:6px;border:1px solid #CCD3E0;border-radius:8px;font:inherit}
@media (max-width:640px){.cfh td:first-child{width:96px}.plage input{max-width:104px;padding:5px 3px}.barre-enr{position:static}.barre-enr .bt{flex:1;justify-content:center}}
.sig{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.sig img{max-height:70px;max-width:220px;border:1px solid var(--trait);border-radius:8px;background:#fff;padding:4px}
.lieu{display:flex;align-items:center;gap:12px;padding:10px 4px;border-bottom:1px solid var(--trait)}.lieu:last-child{border-bottom:0}.lieu.off{opacity:.55}
.lieu img{width:48px;height:48px;object-fit:contain;border:1px solid var(--trait);border-radius:10px;background:#fff;flex:none}
.lieu .av{flex:none;font-size:12px}.lieu .tx{flex:1;min-width:0}.lieu .tx b{display:block}.lieu .tx span{color:var(--doux);font-size:13.5px}
.droits select{min-width:140px}
.tcures.bilan td,.tcures.bilan th{font-size:13.5px}.tcures .n{text-align:right;white-space:nowrap}.tcures tr.cl{cursor:pointer}.tcures tr.cl:hover td{background:#F7F9FD}.tcures tr.tot td{background:#F2F4F8}
.k.fort{background:#E6F4EA;border-color:#BFE3CC}.k.fort b{color:#1F6E3D}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

setTimeout(function () { if (document.querySelector("#page .chargement")) document.getElementById("page").innerHTML = '<div id="secours"><h3>Onco360 n\'a pas pu démarrer</h3><p>Vérifiez la connexion Internet, puis rechargez la page. Si le problème continue, déconnectez-vous puis reconnectez-vous, ou prévenez l\'administrateur.</p><p style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap"><button class="bt plein" onclick="location.reload()">Recharger</button><button class="bt clair" id="btSecours" onclick="onco360Deconnecter()">Se déconnecter</button></p></div>'; var bs = document.getElementById("btSortie"); if (bs && document.getElementById("secours")) bs.onclick = onco360Deconnecter; }, 25000);
// Déconnexion de secours : marche même si l'application n'a pas pu se charger (la page de connexion termine la déconnexion)
function onco360Deconnecter() {
  var b = document.getElementById("btSecours"); if (b) { b.disabled = true; b.textContent = "Déconnexion…"; }
  var fin = function () { location.replace("index.html?sortie=1"); };
  Promise.race([
    import("./js/config.js").then(function (m) { return import("https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js").then(function (a) { return a.signOut(m.auth); }); }),
    new Promise(function (ok) { setTimeout(ok, 6000); })
  ]).then(fin, fin);
}
</script>
